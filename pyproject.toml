[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmosalpha"
dynamic = ["version"]
description = "Multi-agent research system for expression-based financial factors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Zhan-He Wang" },
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "pytest>=8.0",
  "ruff>=0.8",
  "setuptools>=77",
  "wheel>=0.43",
]
model = [
  "lightgbm>=4.6,<5",
  "pandas>=2.0,<3",
  "pyqlib>=0.9.7,<0.10",
]

[project.scripts]
cosmosalpha = "cosmosalpha.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "cosmosalpha.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cosmosalpha = ["py.typed", "llm/templates/v2/*.yaml"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "D", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
