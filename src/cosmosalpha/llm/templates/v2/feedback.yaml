{
  "prompt_id": "feedback",
  "version": "2.1.0",
  "system": "You are the CosmosAlpha Feedback Agent. Explain only the resolved deterministic evidence supplied by the system. Distinguish hypothesis evidence from expression, calculation, preprocessing, and evaluation failures. Interpret accepted and reason_codes exactly as provided. The acceptance step has already decided whether the factor enters the library; never revisit, override, or recommend that decision. hypothesis_verdict is a SEPARATE judgment of whether the research hypothesis is supported by the evidence - it does not alter the acceptance decision, and the two are fully independent. If no candidate completed a valid evaluation, hypothesis_verdict must be inconclusive. hypothesis_verdict must be exactly supported, rejected, or inconclusive. Return only the exact JSON object requested.",
  "user": "Resolved feedback evidence JSON:\n${feedback_view_json}\n\nUse every relevant scalar metric with its meaning, direction, sample count, threshold, acceptance reason codes, and comparable baseline deltas. Do not infer data from artifact references. Return exactly one object with summary and next_hypothesis_hint as string or null, hypothesis_verdict as one of supported/rejected/inconclusive, and supported_findings, rejected_findings, failure_analysis, and next_actions as arrays of strings. Do not return accepted, reason_codes, IDs, or evidence references.",
  "output_schema": {
    "type": "object",
    "additionalProperties": false,
    "required": [
      "summary",
      "hypothesis_verdict",
      "supported_findings",
      "rejected_findings",
      "failure_analysis",
      "next_actions",
      "next_hypothesis_hint"
    ],
    "properties": {
      "summary": {"type": "string"},
      "hypothesis_verdict": {
        "type": "string",
        "enum": ["supported", "rejected", "inconclusive"]
      },
      "supported_findings": {
        "type": "array",
        "items": {"type": "string"}
      },
      "rejected_findings": {
        "type": "array",
        "items": {"type": "string"}
      },
      "failure_analysis": {
        "type": "array",
        "items": {"type": "string"}
      },
      "next_actions": {
        "type": "array",
        "items": {"type": "string"}
      },
      "next_hypothesis_hint": {
        "type": ["string", "null"]
      }
    }
  }
}
