schema_version = "lightgbm-integration-config/1.2"

[factor_source]
storage_root = "runs"
run_id = "replace-with-graph-run-id"
include_rejected_factors = true

[segments.train]
start_date = "2010-04-01"
end_date = "2019-05-31"

[segments.valid]
start_date = "2019-06-01"
end_date = "2020-12-31"

[segments.test]
start_date = "2021-01-01"
end_date = "2025-12-31"

[data]
provider = "qlib"
dataset_version = "qlib-cn-market-v2"
price_adjustment = "post_adjusted"
start_date = "2010-04-01"
end_date = "2025-12-31"
warmup_start_date = "2010-01-04"
market = "cn"
frequency = "1d"
trading_calendar_version = "qlib-cn-market-v2-calendar"

[universe]
name = "csi300"
new_stock_min_age_years = 1

[feature_preprocessing]
# Industry + log_mkt_cap, ret20, turn20 and vol20.
neutralization_enabled = true
mad_multiplier = 5.0
min_cross_section_samples = 100

[correlation_filter]
enabled = false

# Qlib's official Alpha158/CSI300 LightGBM benchmark parameters. Qlib 0.9.7
# supplies num_boost_round=1000 and early_stopping_rounds=50 as class defaults;
# they are repeated here so the resolved run is fully auditable.
[model]
loss = "mse"
colsample_bytree = 0.8879
learning_rate = 0.2
subsample = 0.8789
lambda_l1 = 205.6999
lambda_l2 = 580.9768
max_depth = 8
num_leaves = 210
num_threads = 4
early_stopping_rounds = 50
num_boost_round = 1000

[backtest]
account = 100000000
return_mode = "absolute"
topk = 50
n_drop = 5
hold_thresh = 1
only_tradable = false
forbid_all_trade_at_limit = true
risk_degree = 0.95
limit_threshold = 0.095
open_cost = 0.0
close_cost = 0.0
min_cost = 0
impact_cost = 0.0
trade_unit = 100

[parallel]
# Cross-platform worker count for factor calculation. Keep 1 on laptops unless
# the available memory and CPU budget are known.
factor_workers = 1

[output]
root = "runs"

[qlib]
enabled = true
region = "cn"
instruments = []

[qlib.market]
provider_uri = "~/data/cn_data/qlib_bin"

[[qlib.market.fields]]
field_name = "open"
expression = "$open"

[[qlib.market.fields]]
field_name = "high"
expression = "$high"

[[qlib.market.fields]]
field_name = "low"
expression = "$low"

[[qlib.market.fields]]
field_name = "close"
expression = "$close"

[[qlib.market.fields]]
field_name = "volume"
expression = "$volume"

[[qlib.market.fields]]
field_name = "vwap"
expression = "$vwap"

[[qlib.market.fields]]
field_name = "turn"
expression = "$turn"

[[qlib.market.fields]]
field_name = "free_turn"
expression = "$free_turn"

[[qlib.market.fields]]
field_name = "returns"
expression = "$returns"

[qlib.exposure]
provider_uri = "~/data/cn_data/qlib_exposure_bin"

[[qlib.exposure.fields]]
field_name = "industry_id"
expression = "$industry_id"

[[qlib.exposure.fields]]
field_name = "log_mkt_cap"
expression = "$log_mkt_cap"

[qlib.mask]
provider_uri = "~/data/cn_data/qlib_mask_bin"

[[qlib.mask.fields]]
field_name = "universe_mask"
expression = "$universe_mask"

[[qlib.mask.fields]]
field_name = "eligible_mask"
expression = "$eligible_mask"

[[qlib.mask.fields]]
field_name = "entry_tradable_mask"
expression = "$entry_tradable_mask"

[[qlib.mask.fields]]
field_name = "exit_tradable_mask"
expression = "$exit_tradable_mask"
